[project]
name = "refurbi-api"
version = "0.1.0"
description = "Refurbi API (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "cryptography>=43",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP046", "UP047", "B008"]  # B008: FastAPI Depends() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
